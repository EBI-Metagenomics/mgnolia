name: Test

on:
  pull_request:
    branches:
      - main
      - development
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run --frozen pytest -v
